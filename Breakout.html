<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breakout</title>
<style>
:root{--bg:#f1f0fa;--fg:#1d1a3a;--panel:#1d1a3a;--btn:#ff4f8b;--btn-fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c22;--fg:#f1f0fa;--panel:#191641}}
:root[data-theme="dark"]{--bg:#0e0c22;--fg:#f1f0fa;--panel:#191641}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS",Verdana,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:16px}
.bar{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:1.2rem;font-weight:700}
button{font:inherit;font-weight:700;background:var(--btn);color:var(--btn-fg);border:0;border-radius:999px;padding:8px 20px;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
canvas{width:100%;max-width:720px;aspect-ratio:3/2;background:var(--panel);border-radius:12px;cursor:none;touch-action:none;display:block}
p{max-width:720px;margin:10px 0 0;text-align:center;font-size:.9rem;opacity:.8}
</style>
</head>
<body>
<div class="bar"><span>Score: <span id="score">0</span></span><span id="lives"></span><button id="restart">Restart</button></div>
<canvas id="c" width="720" height="480" aria-label="Breakout game"></canvas>
<p>Move the mouse (or drag a finger) to steer the paddle. Click to launch the ball.</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const COLORS=['#ff4f8b','#ff9f43','#ffd93d','#4ade80','#38bdf8','#a78bfa'];
const COLS=10,ROWS=6,BW=60,BH=22,GAP=6,OFFX=(W-(COLS*(BW+GAP)-GAP))/2,OFFY=50;
let bricks,score,lives,paddle,ball,state,particles;

function reset(){
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    bricks.push({x:OFFX+c*(BW+GAP),y:OFFY+r*(BH+GAP),color:COLORS[r],alive:true});
  score=0;lives=3;particles=[];
  paddle={w:110,h:14,x:W/2-55,y:H-30};
  serve();state='ready';updateHud();
}
function serve(){ball={x:W/2,y:paddle.y-9,r:9,dx:0,dy:0,speed:5}}
function launch(){
  const a=-Math.PI/2+(Math.random()-.5)*.8;
  ball.dx=Math.cos(a)*ball.speed;ball.dy=Math.sin(a)*ball.speed;state='play';
}
function updateHud(){
  document.getElementById('score').textContent=score;
  document.getElementById('lives').textContent='Lives: '+'♥'.repeat(lives);
}
function movePaddle(clientX){
  const rect=cv.getBoundingClientRect();
  const x=(clientX-rect.left)*(W/rect.width);
  paddle.x=Math.max(0,Math.min(W-paddle.w,x-paddle.w/2));
}
cv.addEventListener('mousemove',e=>movePaddle(e.clientX));
cv.addEventListener('touchmove',e=>{movePaddle(e.touches[0].clientX)},{passive:true});
cv.addEventListener('touchstart',e=>{movePaddle(e.touches[0].clientX);if(state==='ready')launch()},{passive:true});
cv.addEventListener('click',()=>{if(state==='ready')launch()});
document.getElementById('restart').addEventListener('click',reset);

function burst(x,y,color){
  for(let i=0;i<10;i++)particles.push({x,y,dx:(Math.random()-.5)*6,dy:(Math.random()-.5)*6,life:24,color});
}
function update(){
  particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.life--});
  particles=particles.filter(p=>p.life>0);
  if(state==='ready'){ball.x=paddle.x+paddle.w/2;ball.y=paddle.y-ball.r;return}
  if(state!=='play')return;
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x<ball.r){ball.x=ball.r;ball.dx*=-1}
  if(ball.x>W-ball.r){ball.x=W-ball.r;ball.dx*=-1}
  if(ball.y<ball.r){ball.y=ball.r;ball.dy*=-1}
  // paddle
  if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h+8&&
     ball.x>paddle.x-ball.r&&ball.x<paddle.x+paddle.w+ball.r){
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    const a=hit*Math.PI/3;
    ball.speed=Math.min(9,ball.speed+.1);
    ball.dx=Math.sin(a)*ball.speed;ball.dy=-Math.cos(a)*ball.speed;
    ball.y=paddle.y-ball.r;
  }
  // bricks
  for(const b of bricks){
    if(!b.alive)continue;
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+BW&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+BH){
      b.alive=false;score+=10;burst(b.x+BW/2,b.y+BH/2,b.color);
      const ox=Math.min(ball.x+ball.r-b.x,b.x+BW-(ball.x-ball.r));
      const oy=Math.min(ball.y+ball.r-b.y,b.y+BH-(ball.y-ball.r));
      if(ox<oy)ball.dx*=-1;else ball.dy*=-1;
      updateHud();
      if(bricks.every(k=>!k.alive))state='won';
      break;
    }
  }
  if(ball.y-ball.r>H){
    lives--;updateHud();
    if(lives<=0)state='lost';else{serve();ball.speed=5;state='ready'}
  }
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){
  ctx.clearRect(0,0,W,H);
  bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;rr(b.x,b.y,BW,BH,6)}});
  particles.forEach(p=>{ctx.globalAlpha=p.life/24;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)});
  ctx.globalAlpha=1;
  ctx.fillStyle='#f1f0fa';rr(paddle.x,paddle.y,paddle.w,paddle.h,7);
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#ffd93d';ctx.fill();
  if(state!=='play'){
    ctx.fillStyle='rgba(14,12,34,.55)';
    if(state!=='ready')ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f1f0fa';ctx.textAlign='center';ctx.font='bold 30px "Trebuchet MS",Verdana,sans-serif';
    const msg={ready:'Click to launch',won:'You cleared the wall! Score '+score,lost:'Game over. Score '+score}[state];
    ctx.fillText(msg,W/2,H/2+40);
    if(state!=='ready'){ctx.font='18px "Trebuchet MS",Verdana,sans-serif';ctx.fillText('Press Restart to play again',W/2,H/2+75)}
  }
}
function loop(){update();draw();requestAnimationFrame(loop)}
reset();loop();
</script>
</body>
</html>
